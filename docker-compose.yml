services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Required for per-commit intent analysis; the API still serves without it.
      - PRISM_GROQ_API_KEY=${PRISM_GROQ_API_KEY:-}
      - PRISM_CORS_ORIGINS=http://localhost:3000
      # Persisted so ingested repos survive restarts (backend default is /tmp).
      - PRISM_DATA_DIR=/data
      # Pre-loads a demo repo on first start; empty disables it.
      - PRISM_DEMO_REPO=${PRISM_DEMO_REPO:-https://github.com/abdullah129026/prism-ai-git-time-machine}
    volumes:
      - prism_data:/data

volumes:
  prism_data:
